# ===========================================================================
# NEVIE-GLOBAL SAS — extrait de configuration Nginx
# À inclure dans le bloc server{} du domaine.
#
# Généré par outils/entetes.py — ne pas modifier à la main : régénérer.
# ===========================================================================

root /var/www/nevie-global;
index index.html;

error_page 404 /404.html;

# --- En-têtes de sécurité -------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-ImkO5TFj1nPFxOZDuPCSH0u6F20rWcLSr7gB/g65Syc='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://nevie-global.app.n8n.cloud; form-action 'self' https://nevie-global.app.n8n.cloud; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- Compression ----------------------------------------------------------
gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

# --- Cache ----------------------------------------------------------------
location ~* \.(css|js|woff2|png|jpg|jpeg|webp|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

# --- URL sans extension : /contact sert contact.html ----------------------
location / {
    try_files $uri $uri.html $uri/ =404;
}
